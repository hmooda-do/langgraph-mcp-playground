[project]
name = "langgraph-mcp-playground"
version = "0.1.0"
description = "Minimal LangGraph starter: plug in any LLM, then connect MCP servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.2",
    "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = []
